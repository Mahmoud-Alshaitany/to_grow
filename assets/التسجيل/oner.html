<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <style>
        body{
        color: white;
        display: flex;
        justify-content: center;
        background-color: #252525;
        padding-top: 150px;
     }
     .form-container{
        display: flex;
        flex-direction: column;
        border: 2px solid rgb(161, 160, 160);
        border-radius: 5%;
        width: 400px;
        padding: 20px;
     }
     form{
        display: flex;
        flex-direction: column;
        padding: 10px;
     }
     h2{
        text-align: center;
     }
     label{
        text-align: right;
        margin-top: 3px;
        margin-bottom: 3px;
     }
     input{
        border: 1px solid gray;
        border-radius: 3px;
        padding: 5px;
     }
     button{
        margin-top: 8px;
        background-color: #4caf50;
        border: 1px rgb(238, 238, 238);
        padding: 6px;
        width: 100px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        text-align: center;
        color: aliceblue;
     }
     .bnts{
        
        margin-left: 100px;
     }
     button:hover{
        background-color:rgb(54, 95, 54);
     }
     a{
        color: #75fb79;
        font-size: 14px;
        text-align: left;
        cursor: pointer;
     }
     a:hover{
        color: rgb(54, 95, 54);
        
     }
    </style>
</head>
<body>
<div class="form-container">
    <h2>تسجيل الدخول</h2>  
    <form action="">
        <label for="email">البريد الالكترونى</label>
        <input type="email" id="email">
        <label for="password">كلمه السر</label>
        <input type="password" id="password">
        <div class="btns">
            <button type="submit">الغاء</button>
            <button type="submit">تسجيل</button>
        </div>
    </form>
    <a href="./forget-password.html">هل نسيت كلمه السر؟</a>
</div>
</body>
</html>
